name: Nightly
on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Run npm audit
        run: npm audit --audit-level=moderate
      - name: Check outdated dependencies
        run: npm outdated
        continue-on-error: true
  benchmark:
    name: Benchmark
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node --test test/benchmark.test.js
  health:
    name: Package Health
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Check package size
        run: npm pack --dry-run
      - name: Verify entry points
        run: |
          node -e "require('./index.js')"
          node -e "require('./src/crypto.js')"
          echo "All entry points OK"
