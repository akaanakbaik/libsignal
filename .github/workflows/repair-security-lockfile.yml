name: Temporary security lockfile repair
on:
  push:
    branches:
      - fix/minimatch-security-audit-20261105
    paths:
      - .github/workflows/repair-security-lockfile.yml
permissions:
  contents: write
jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Regenerate lockfile with patched minimatch
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit regenerated lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "fix(lockfile): resolve patched minimatch dependencies"
            git push origin HEAD:refs/heads/fix/minimatch-security-audit-20261105
          fi
      - name: Verify clean install
        run: npm ci --ignore-scripts
      - name: Verify dependency security
        run: npm audit --audit-level=moderate
      - name: Verify lint
        run: npm run lint
      - name: Verify unit tests
        run: npm test
      - name: Verify benchmark tests
        run: node --test test/benchmark.test.js
